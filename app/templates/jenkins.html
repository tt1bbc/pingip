{% extends "base.html" %}

{% block title %}Jenkins{% endblock %}
{% block head %}
{% endblock %}
{% block content %}
<div class="page-shell">
    <div class="panel jenkins-builder">
        <section class="job-picker-panel">
            <div class="head-row">
                <h2>选择 Jenkins Job</h2>
            </div>
            <div class="jenkins-search">
                <label for="job-search">检索 Job</label>
                <input id="job-search" class="input" type="search" placeholder="输入关键字快速匹配 Job">
                <span class="hint" id="job-match-count"></span>
            </div>

            <div class="jobs-grid" id="jobs">
                {% for job in jobs %}
                <div class="item" data-value="{{ job }}">{{ job }}</div>
                {% endfor %}
            </div>
        </section>

        <section class="selected-jobs-panel">
            <div class="queue-header">
                <h2>构建队列</h2>
                <div class="queue-actions">
                    <button class="btn btn-secondary" id="clear-btn">清空</button>
                    <button class="btn btn-primary" id="build-btn">构建</button>
                </div>
            </div>
            <div id="loadingMessage" class="hint" style="display: none;">正在加载，请稍候...</div>
            <div class="queue-table-wrap">
                <table id="jobParamTable" border="1">
                    <thead>
                        <tr>
                            <th style="width: 38%">Job</th>
                            <th style="width: 22%">状态</th>
                            <th style="width: 40%">参数</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<script>
    const items = document.querySelectorAll('.item');
    const clearBtn = document.getElementById('clear-btn');
    const jobParamTableBody = document.querySelector('#jobParamTable tbody');
    const buildBtn = document.getElementById('build-btn');
    const jobSearchInput = document.getElementById('job-search');
    const jobMatchCount = document.getElementById('job-match-count');
    const jobPickerPanel = document.querySelector('.job-picker-panel');
    const selectedJobs = [];

    items.forEach(item => {
        item.addEventListener('click', () => {
            item.classList.toggle('selected');

            const jobName = item.dataset.value;

            if (item.classList.contains('selected')) {
                if (!selectedJobs.includes(jobName)) {
                    selectedJobs.push(jobName);
                }
                addRowToTable(jobName);
            } else {
                const index = selectedJobs.indexOf(jobName);
                if (index !== -1) {
                    selectedJobs.splice(index, 1);
                }
                removeRowFromTable(jobName);
            }
        });
    });

    clearBtn.addEventListener('click', () => {
        document.querySelectorAll('.item').forEach(item => item.classList.remove('selected'));
        selectedJobs.length = 0;
        jobParamTableBody.innerHTML = '';
    });

    jobSearchInput.addEventListener('input', applyJobFilter);

    buildBtn.addEventListener('click', async () => {
        const selected = selectedJobs.slice();

        if (selected.length === 0) {
            alert('请先选择一个或多个 Job');
            return;
        }

        buildBtn.disabled = true;
        buildBtn.style.backgroundColor = '#d3d3d3';

        try {
            const paramResp = await fetch('/jenkins/get-job-parameters-batch', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ job_names: selected })
            });
            if (!paramResp.ok) {
                throw new Error(`错误: ${paramResp.statusText}`);
            }
            const paramData = await paramResp.json();
            const results = paramData.results || {};
            selected.forEach(jobName => {
                const params = results[jobName] || [{ name: '错误', default: '无数据' }];
                updateRowParameters(jobName, params);
                updateRowStatus(jobName, '等待构建');
            });

            const buildResp = await fetch('/jenkins/build-batch', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ job_names: selected })
            });
            if (!buildResp.ok) {
                throw new Error(`错误: ${buildResp.statusText}`);
            }
            selected.forEach(jobName => {
                updateRowStatus(jobName, '已提交，构建中');
            });
        } catch (error) {
            console.error('Error:', error);
            selected.forEach(jobName => {
                updateRowStatus(jobName, `失败: ${error.message}`);
            });
        } finally {
            buildBtn.disabled = false;
            buildBtn.style.backgroundColor = '';
        }
    });

    function addRowToTable(jobName) {
        const row = document.createElement('tr');
        row.setAttribute('id', `row-${jobName}`);

        const jobNameCell = document.createElement('td');
        jobNameCell.textContent = jobName;
        row.appendChild(jobNameCell);

        const statusCell = document.createElement('td');
        statusCell.textContent = '未构建';
        row.appendChild(statusCell);

        const paramCell = document.createElement('td');
        paramCell.className = 'param-cell';
        paramCell.textContent = '未加载';
        row.appendChild(paramCell);

        jobParamTableBody.appendChild(row);
    }

    function removeRowFromTable(jobName) {
        const row = document.getElementById(`row-${jobName}`);
        if (row) {
            jobParamTableBody.removeChild(row);
        }
    }

    function updateRowParameters(jobName, parameters) {
        const row = document.getElementById(`row-${jobName}`);

        if (row) {
            const paramCell = row.querySelector('td:nth-child(3)');

            if (parameters.length > 0) {
                paramCell.textContent = '';
                const details = document.createElement('details');
                details.className = 'param-details';

                const summary = document.createElement('summary');
                summary.textContent = `${parameters.length} 个参数`;
                details.appendChild(summary);

                const list = document.createElement('div');
                list.className = 'param-list';
                parameters.forEach(param => {
                    const item = document.createElement('div');
                    item.className = 'param-row';

                    const name = document.createElement('span');
                    name.className = 'param-name';
                    name.textContent = param.name;

                    const value = document.createElement('span');
                    value.className = 'param-value';
                    value.textContent = param.default;

                    item.appendChild(name);
                    item.appendChild(value);
                    list.appendChild(item);
                });
                details.appendChild(list);
                paramCell.appendChild(details);
            } else {
                paramCell.textContent = '无参数';
            }
        } else {
            console.error(`Row for job '${jobName}' not found`);
        }
    }

    function updateRowStatus(jobName, statusText) {
        const row = document.getElementById(`row-${jobName}`);
        if (row) {
            const statusCell = row.querySelector('td:nth-child(2)');
            statusCell.textContent = statusText;
        }
    }

    function applyJobFilter() {
        const query = jobSearchInput.value.trim().toLowerCase();
        let visibleCount = 0;
        jobPickerPanel.classList.toggle('is-filtering', Boolean(query));
        items.forEach(item => {
            const jobName = item.dataset.value.toLowerCase();
            const matched = !query || jobName.includes(query);
            item.style.display = matched ? '' : 'none';
            if (matched) {
                visibleCount += 1;
            }
        });
        jobMatchCount.textContent = query ? `匹配 ${visibleCount} 个 Job` : `共 ${items.length} 个 Job`;
    }

    applyJobFilter();
</script>
{% endblock %}
