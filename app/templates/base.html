<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Flask App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% block head %}
    {% endblock %}
</head>
<body>

<header>
    <nav class="navbar sidebar">
        <div class="logo">
            <a href="/">自用省事</a>
        </div>
        <ul class="nav-links">
            <li><a href="/">首页</a></li>
            <li><a href="/net/pingpage">网段探测</a></li>
            <li class="has-submenu">
                <details class="submenu-details" data-menu="jenkins">
                    <summary class="submenu-toggle">MyJenkins</summary>
                    <ul class="submenu">
                        <li><a href="/jenkins/trigger">构建 Jenkins</a></li>
                        <li><a href="/jenkins/history">Jenkins 构建记录</a></li>
                        <li><a href="/jenkins/audit">jenkins 审计</a></li>
                    </ul>
                </details>
            </li>
            <li><a href="/about">关于</a></li>
        </ul>
    </nav>
</header>

<main class="content">
    <div class="container">
        {% block content %}
        <!-- 页面内容将被插入这里 -->
        {% endblock %}
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const menus = document.querySelectorAll('.submenu-details[data-menu]');
        menus.forEach(menu => {
            const key = `submenu-open:${menu.dataset.menu}`;
            const saved = localStorage.getItem(key);
            if (saved === 'true') {
                menu.open = true;
            }
            menu.addEventListener('toggle', () => {
                localStorage.setItem(key, String(menu.open));
            });
            menu.querySelectorAll('.submenu a').forEach(link => {
                link.addEventListener('click', () => {
                    localStorage.setItem(key, 'true');
                });
            });
        });
    });
</script>

</body>
</html>
