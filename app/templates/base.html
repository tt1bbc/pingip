<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DevOps Console{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    {% block head %}
    {% endblock %}
</head>
<body>

<header>
    <nav class="navbar sidebar">
        <div class="logo">
            <a href="/">DevOps Console</a>
        </div>
        <ul class="nav-links">
            <li><a href="/">首页</a></li>
            <li><a href="/net/pingpage">网段探测</a></li>
            <li class="has-submenu">
                <details class="submenu-details" data-menu="jenkins">
                    <summary class="submenu-toggle">MyJenkins</summary>
                    <ul class="submenu">
                        <li><a href="/jenkins/trigger">构建 Jenkins</a></li>
                        <li><a href="/jenkins/history">Jenkins 构建记录</a></li>
                        <li><a href="/jenkins/audit">jenkins 审计</a></li>
                    </ul>
                </details>
            </li>
        </ul>
    </nav>
</header>

<main class="content">
    <div class="container">
        {% block content %}
        <!-- 页面内容将被插入这里 -->
        {% endblock %}
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const menus = document.querySelectorAll('.submenu-details[data-menu]');
        const currentPath = window.location.pathname;
        document.querySelectorAll('.nav-links a').forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPath) {
                link.classList.add('is-active');
                const parentMenu = link.closest('.submenu-details');
                if (parentMenu) {
                    parentMenu.open = true;
                }
            }
        });
        menus.forEach(menu => {
            const key = `submenu-open:${menu.dataset.menu}`;
            const saved = localStorage.getItem(key);
            if (saved === 'true') {
                menu.open = true;
            }
            menu.addEventListener('toggle', () => {
                localStorage.setItem(key, String(menu.open));
            });
            menu.querySelectorAll('.submenu a').forEach(link => {
                link.addEventListener('click', () => {
                    localStorage.setItem(key, 'true');
                });
            });
        });

        document.querySelectorAll('[data-combobox]').forEach(combo => {
            const field = combo.previousElementSibling;
            const trigger = combo.querySelector('.combo-trigger');
            const valueNode = combo.querySelector('.combo-value');
            const menu = combo.querySelector('.combo-menu');
            const options = combo.querySelectorAll('.combo-option');

            const syncFromField = () => {
                const selected = Array.from(options).find(option => option.dataset.value === field.value) || options[0];
                if (!selected) {
                    return;
                }
                valueNode.textContent = selected.textContent;
                options.forEach(item => item.classList.toggle('is-selected', item === selected));
            };

            const close = () => {
                combo.classList.remove('is-open');
                trigger.setAttribute('aria-expanded', 'false');
            };

            const open = () => {
                document.querySelectorAll('[data-combobox].is-open').forEach(other => {
                    if (other !== combo) {
                        other.classList.remove('is-open');
                        other.querySelector('.combo-trigger').setAttribute('aria-expanded', 'false');
                    }
                });
                combo.classList.add('is-open');
                trigger.setAttribute('aria-expanded', 'true');
            };

            options.forEach(option => {
                option.addEventListener('click', () => {
                    field.value = option.dataset.value;
                    field.dispatchEvent(new Event('change', { bubbles: true }));
                    close();
                });
            });

            field.addEventListener('change', syncFromField);
            syncFromField();

            trigger.addEventListener('click', event => {
                event.stopPropagation();
                combo.classList.contains('is-open') ? close() : open();
            });

            menu.addEventListener('click', event => {
                event.stopPropagation();
            });
        });

        document.addEventListener('click', () => {
            document.querySelectorAll('[data-combobox].is-open').forEach(combo => {
                combo.classList.remove('is-open');
                combo.querySelector('.combo-trigger').setAttribute('aria-expanded', 'false');
            });
        });
    });
</script>

</body>
</html>
