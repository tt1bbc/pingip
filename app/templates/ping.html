{% extends "base.html" %}

{% block title %}Ping 网段{% endblock %}

{% block content %}
<div class="page-shell">
    <section class="tool-panel ping-panel">
        <div class="tool-head">
            <div>
                <h2>Ping 网段</h2>
                <p class="hint">选择预设网段后开始探测，结果会按连通和异常分组展示。</p>
            </div>
        </div>
        <div class="ping-toolbar">
            <div class="field-inline">
                <label for="dropdown">目标网段</label>
                <input type="hidden" id="dropdown" value="{{ comrange[0] if comrange else '' }}">
                <div class="custom-combobox" data-combobox>
                    <button class="combo-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                        <span class="combo-value">{{ comrange[0] if comrange else '请选择网段' }}</span>
                    </button>
                    <div class="combo-menu" role="listbox">
                    {% for range in comrange %}
                        <button class="combo-option" type="button" data-value="{{ range }}" role="option">{{ range }}</button>
                    {% endfor %}
                    </div>
                </div>
            </div>
            <button class="btn btn-primary" id="ping-btn">开始 Ping</button>
        </div>
    </section>

    <div class="results-container" id="results-container" style="display: none;">
        <div class="results-column success-column">
            <div class="result-head">
                <h3>成功结果</h3>
                <span class="result-count" id="success-count">0</span>
            </div>
            <ul id="success-results" class="results"></ul>
        </div>

        <div class="results-column fail-column">
            <div class="result-head">
                <h3>失败结果</h3>
                <span class="result-count" id="fail-count">0</span>
            </div>
            <ul id="fail-results" class="results"></ul>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('ping-btn').addEventListener('click', function() {
            const ipRange = document.getElementById('dropdown').value;
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('success-results').innerHTML = '';
            document.getElementById('fail-results').innerHTML = '';
            document.getElementById('success-count').textContent = '0';
            document.getElementById('fail-count').textContent = '0';
            document.body.style.cursor = 'wait';

            fetch('/net/ping', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    ip_range: ipRange
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const sortedSuccessHosts = Object.keys(data.success).sort((a, b) => {
                        const partsA = a.split('.').map(Number);
                        const partsB = b.split('.').map(Number);
                        for (let i = 0; i < partsA.length; i++) {
                            if (partsA[i] < partsB[i]) return -1;
                            if (partsA[i] > partsB[i]) return 1;
                        }
                        return 0;
                    });
                    sortedSuccessHosts.forEach(host => {
                        const delay = data.success[host];
                        const item = document.createElement('li');
                        item.className = 'result-item success';
                        item.textContent = `${host}: ${delay} ms`;
                        document.getElementById('success-results').appendChild(item);
                    });
                    document.getElementById('success-count').textContent = sortedSuccessHosts.length;
                }

                if (data.fail) {
                    const sortedFailHosts = Object.keys(data.fail).sort((a, b) => {
                        const partsA = a.split('.').map(Number);
                        const partsB = b.split('.').map(Number);
                        for (let i = 0; i < partsA.length; i++) {
                            if (partsA[i] < partsB[i]) return -1;
                            if (partsA[i] > partsB[i]) return 1;
                        }
                        return 0;
                    });
                    sortedFailHosts.forEach(host => {
                        const message = data.fail[host];
                        const item = document.createElement('li');
                        item.className = 'result-item fail';
                        item.textContent = `${host}: ${message}`;
                        document.getElementById('fail-results').appendChild(item);
                    });
                    document.getElementById('fail-count').textContent = sortedFailHosts.length;
                }

                document.getElementById('results-container').style.display = 'grid';
                document.body.style.cursor = 'default';
            })
            .catch(() => {
                alert('Ping 请求失败，请检查网络或输入的网段。');
                document.body.style.cursor = 'default';
            });
        });
    });
</script>
{% endblock %}
