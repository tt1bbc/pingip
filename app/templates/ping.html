{% extends "base.html" %}

{% block title %}Ping 网段{% endblock %}

{% block content %}

<div class="combo-box">
    <h2>Ping 网段</h2>
    <select id="dropdown" class="custom-select">
        {% for range in comrange %}
        <option value="{{ range }}">{{ range }}</option>
        {% endfor %}
    </select>
    <button class="btn" id="ping-btn">Ping</button>
</div>

<div class="results-container" id="results-container" style="display: none;">
    <div class="results-column success-column">
        <h3>成功的结果</h3>
        <ul id="success-results" class="results"></ul>
    </div>

    <div class="results-column fail-column">
        <h3>失败的结果</h3>
        <ul id="fail-results" class="results"></ul>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('ping-btn').addEventListener('click', function() {
            const ipRange = document.getElementById('dropdown').value;
            document.getElementById('results-container').style.display = 'none';
            document.getElementById('success-results').innerHTML = '';
            document.getElementById('fail-results').innerHTML = '';
            document.body.style.cursor = 'wait';
    
            fetch('/ping', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    ip_range: ipRange
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 对成功的IP地址进行自定义排序
                    const sortedSuccessHosts = Object.keys(data.success).sort((a, b) => {
                        const partsA = a.split('.').map(Number);
                        const partsB = b.split('.').map(Number);
                        for (let i = 0; i < partsA.length; i++) {
                            if (partsA[i] < partsB[i]) return -1;
                            if (partsA[i] > partsB[i]) return 1;
                        }
                        return 0;
                    });
                    sortedSuccessHosts.forEach(host => {
                        const delay = data.success[host];
                        document.getElementById('success-results').innerHTML += `<li class="result-item success">${host}: ${delay} ms</li>`;
                    });
                }
    
                if (data.fail) {
                    // 对失败的IP地址进行自定义排序
                    const sortedFailHosts = Object.keys(data.fail).sort((a, b) => {
                        const partsA = a.split('.').map(Number);
                        const partsB = b.split('.').map(Number);
                        for (let i = 0; i < partsA.length; i++) {
                            if (partsA[i] < partsB[i]) return -1;
                            if (partsA[i] > partsB[i]) return 1;
                        }
                        return 0;
                    });
                    sortedFailHosts.forEach(host => {
                        const message = data.fail[host];
                        document.getElementById('fail-results').innerHTML += `<li class="result-item fail">${host}: ${message}</li>`;
                    });
                }
    
                document.getElementById('results-container').style.display = 'flex';
                document.body.style.cursor = 'default';
            })
            .catch(() => {
                alert('Ping 请求失败，请检查网络或输入的网段。');
                document.body.style.cursor = 'default';
            });
        });
    });
</script>
{% endblock %}
